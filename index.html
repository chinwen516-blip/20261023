<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <!-- 讓網頁在手機、平板與電腦上正確縮放 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- 設定網頁標題 -->
    <title>國中七年級歷史小測驗</title>

    <!-- 預先連線至 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- 預先連線至 Google Fonts 的字型伺服器 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 載入 Changa One 與 LXGW WenKai TC 字型 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=LXGW+WenKai+TC&display=swap"
      rel="stylesheet"
    />

    <!-- 載入 p5.js 函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

    <!-- 載入主要程式 -->
    <script src="sketch.js"></script>

    <!-- 設定網頁基本樣式 -->
    <style>
      /* 移除瀏覽器預設外距 */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #bde0fe;
      }

      /* 讓畫布以區塊方式顯示，避免底部產生空白 */
      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
  </body>
</html>
